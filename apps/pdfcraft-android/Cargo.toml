[package]
name = "pdfcraft-android"
description = "PdfCraft on Android (build with `cargo apk build -p pdfcraft-android --lib --release`)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Not `[lints] workspace = true`: the workspace forbids `unsafe_code`, and Android's entry point
# must be `#[unsafe(no_mangle)] fn android_main`; the Activity reference for JNI (`immersive`) is
# the one other unsafe line.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lib]
# cdylib: the shared library the Android activity loads; lib: so the desktop workspace builds it.
crate-type = ["cdylib", "lib"]

[target.'cfg(target_os = "android")'.dependencies]
pdfcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence", "android-native-activity"] }
# Same version the egui example uses; the workspace patch pins winit to storytold's revision.
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
log = { workspace = true }
# The version android-activity already uses: hides the system bars through `java/Immersive`.
jni = "0.22"

[package.metadata.android]
package = "org.pdfcraft.music"
apk_name = "PdfMusicCraft"
# Launcher icons, drawn by `make_icon.py`.
resources = "res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
# 34, not 35: Android 15 forces apps targeting 35 to draw under the status bar (edge to edge),
# where the tab strip would sit behind the clock.
target_sdk_version = 34

[package.metadata.android.application]
label = "PdfMusicCraft"
icon = "@mipmap/ic_launcher"
# No status bar: the pages and the app's own bars get the whole screen.
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# Keep the activity (and the open document) alive across rotation and keyboard changes.
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode"
orientation = "unspecified"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

# "All files access" (Android 11+), granted in Settings ▸ Apps ▸ PdfCraft: the app's own file
# browser lists and saves PDFs anywhere in shared storage (Download, Documents…).
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
